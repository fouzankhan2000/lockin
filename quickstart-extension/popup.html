<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickStart</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header>
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <rect x="3" y="3" width="18" height="18" rx="4" fill="#2383e2"/>
          <path d="M8 12L11 15L16 9" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <h1>QuickStart</h1>
      </div>
      <p class="tagline">Launch your focus mode</p>
    </header>

    <!-- Stats Banner -->
    <div id="stats-banner" class="stats-banner hidden">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
        <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="currentColor"/>
      </svg>
      <span id="stats-text"></span>
    </div>

    <!-- Saved Work Modes List -->
    <section id="modes-section">
      <div class="section-header">
        <h2>Work Modes</h2>
      </div>
      <div id="modes-list">
        <!-- Work modes will be rendered here -->
      </div>
      <div id="empty-message" class="empty-state hidden">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none">
          <rect x="3" y="3" width="18" height="18" rx="3" stroke="currentColor" stroke-width="1.5"/>
          <path d="M12 8V16M8 12H16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <p>No work modes yet</p>
        <span>Create your first mode below</span>
      </div>
    </section>

    <!-- Create New Work Mode Form -->
    <section id="create-section">
      <div class="section-header">
        <h2>New Mode</h2>
      </div>
      <form id="create-form" class="card">
        <div class="form-group">
          <label for="mode-name">Name</label>
          <input
            type="text"
            id="mode-name"
            placeholder="e.g., Deep Work"
            required
          >
        </div>

        <div class="form-group">
          <label for="mode-urls">URLs</label>
          <textarea
            id="mode-urls"
            placeholder="notion.so&#10;docs.google.com&#10;figma.com"
            rows="3"
            required
          ></textarea>
          <span class="hint">One URL per line</span>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="mode-timer">Timer</label>
            <div class="input-with-suffix">
              <input
                type="number"
                id="mode-timer"
                placeholder="25"
                min="1"
                max="180"
              >
              <span class="suffix">min</span>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label class="toggle-label">
            <span class="toggle-wrapper">
              <input type="checkbox" id="mode-close-tabs">
              <span class="toggle-slider"></span>
            </span>
            <span class="toggle-text">
              Close other tabs when starting
              <span class="toggle-hint">Pinned tabs will be kept open</span>
            </span>
          </label>
        </div>

        <button type="submit" class="btn btn-primary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          Create Mode
        </button>
      </form>
    </section>
  </div>

  <script src="popup.js"></script>
</body>
</html>
